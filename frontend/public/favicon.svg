<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- PreBase — Codebase Intelligence Product Icon -->
  <defs>
    <linearGradient id="pb-core" x1="11" y1="11" x2="21" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="pb-ring" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Orbital Constellation Ring -->
  <circle cx="16" cy="16" r="12" stroke="url(#pb-ring)" stroke-width="2" stroke-dasharray="4 2.5" opacity="0.95"/>

  <!-- Network Interconnection Edges -->
  <line x1="16" y1="16" x2="25" y2="10" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="8" y2="21" stroke="#818CF8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="22" y2="23" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="9" y2="9" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>

  <!-- Satellite Nodes -->
  <circle cx="25" cy="10" r="3.2" fill="#22D3EE"/>
  <circle cx="8" cy="21" r="2.8" fill="#818CF8"/>
  <circle cx="22" cy="23" r="2.4" fill="#38BDF8"/>
  <circle cx="9" cy="9" r="2.2" fill="#A78BFA"/>

  <!-- Central Intelligence Core (Glow + Gradient Orb + Hotspot) -->
  <circle cx="16" cy="16" r="5.2" fill="url(#pb-core)"/>
  <circle cx="16" cy="16" r="2.4" fill="#FFFFFF"/>
</svg>
