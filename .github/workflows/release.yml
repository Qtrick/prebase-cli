name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  verify:
    name: Verify Before Publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Record toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install and test frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  build-release:
    name: Build Release Asset (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: prebase-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: prebase-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: prebase-macos-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Build Frontend Distribution
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin prebase

      - name: Run Target Release Binary Smoke Test
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        run: python3 scripts/smoke_test_release_binary.py "target/${{ matrix.target }}/release/prebase"

      - name: Package Binary, Verify Archive & Compute Checksum
        run: |
          mkdir -p dist
          ARCHIVE_NAME="${{ matrix.artifact_name }}"
          tar -czf "dist/$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" prebase
          # The archive must contain exactly the executable at its root.
          tar -tzf "dist/$ARCHIVE_NAME" | grep -qx 'prebase'
          test -s "dist/$ARCHIVE_NAME"
          # Compute checksum recording archive basename only for portable verification
          (cd dist && if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
            sha256sum -c "$ARCHIVE_NAME.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
            shasum -a 256 -c "$ARCHIVE_NAME.sha256"
          fi)

      - name: Upload Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: release-assets

      - name: Verify downloaded assets
        run: |
          set -euo pipefail
          ls -R release-assets
          # Three archives plus three checksum files.
          test "$(find release-assets -name '*.tar.gz' | wc -l)" -eq 3
          test "$(find release-assets -name '*.sha256' | wc -l)" -eq 3
          for f in release-assets/*/*.sha256; do
            (cd "$(dirname "$f")" && if command -v sha256sum >/dev/null 2>&1; then sha256sum -c "$(basename "$f")"; else shasum -a 256 -c "$(basename "$f")"; fi)
          done

      - name: Create Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
