name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  verify:
    name: Verify Before Publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy

      - name: Record toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Install and test frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  build-release:
    name: Build Release Asset (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: prebase-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: prebase-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: prebase-macos-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build Frontend Distribution
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin prebase

      - name: Run Target Release Binary Smoke Test
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        run: python3 scripts/smoke_test_release_binary.py "target/${{ matrix.target }}/release/prebase"

      - name: Package Binary, Verify Archive & Compute Checksum
        run: |
          mkdir -p dist
          ARCHIVE_NAME="${{ matrix.artifact_name }}"
          tar -czf "dist/$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" prebase
          # The archive must contain exactly the executable at its root.
          tar -tzf "dist/$ARCHIVE_NAME" | grep -qx 'prebase'
          test -s "dist/$ARCHIVE_NAME"
          # Compute checksum recording archive basename only for portable verification
          (cd dist && if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
            sha256sum -c "$ARCHIVE_NAME.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
            shasum -a 256 -c "$ARCHIVE_NAME.sha256"
          fi)

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets

      - name: Verify downloaded assets
        run: |
          set -euo pipefail
          ls -R release-assets
          # Three archives plus three checksum files.
          test "$(find release-assets -name '*.tar.gz' | wc -l)" -eq 3
          test "$(find release-assets -name '*.sha256' | wc -l)" -eq 3
          for f in release-assets/*/*.sha256; do
            (cd "$(dirname "$f")" && if command -v sha256sum >/dev/null 2>&1; then sha256sum -c "$(basename "$f")"; else shasum -a 256 -c "$(basename "$f")"; fi)
          done

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
