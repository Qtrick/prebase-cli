name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only workflow token: CI never needs to write to the repository.
permissions:
  contents: read

# Superseded pushes to the same ref should not keep burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'

      - name: Setup Rust toolchain
        # Pinned in rust-toolchain.toml; keep this in sync so `cargo` and
        # `cargo clippy` resolve to exactly the same compiler locally and in CI.
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Record toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          cargo clippy --version
          git --version
          python3 --version

      - name: Install Frontend Dependencies & Run Frontend Tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Cache Cargo Dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --locked --verbose

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Playwright
        run: |
          pip install -r requirements-test.txt
          playwright install --with-deps chromium

      - name: Build PreBase Binary
        run: cargo build --release --locked --bin prebase

      - name: Run Release Binary Smoke Verification
        run: python3 scripts/smoke_test_release_binary.py

      - name: Run CLI Workflow & Lifecycle Verification
        run: python3 scripts/verify_cli_workflows.py

      - name: Run RFC 6265 Cookie Port Isolation Tests
        run: python3 scripts/test_cookie_port_scoping.py

      - name: Run Stage 2 2D Relationship Explorer E2E Verification
        run: python3 scripts/e2e_stage2_verification.py

      - name: Run Full E2E & Live Filesystem Synchronization Verification
        run: python3 scripts/e2e_full_verification.py

      - name: Run 3D Network Orb Real Browser Verification
        run: python3 scripts/verify_orb_browser.py

      - name: Run Multi-Area Exploration Browser Verification
        run: python3 scripts/verify_area_exploration_browser.py

      - name: Run Temporal DAG & Auth Lifecycle Real Browser Verification
        run: python3 scripts/verify_temporal_lifecycle_browser.py

      - name: Run Performance Benchmarks
        run: ./scripts/benchmark.sh

      # Upload browser failure artifacts (sanitized failure screenshots and diagnostics)
      - name: Upload browser failure artifacts on failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: browser-failure-artifacts-${{ matrix.os }}
          path: test-results/failure-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      # Raw logs can contain bootstrap/session tokens, so they are deliberately
      # not uploaded. Use the failing step's GitHub log instead.
