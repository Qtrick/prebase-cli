name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies & Run Frontend Tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Build PreBase Binary
        run: cargo build --release --bin prebase

      - name: Run CLI Workflow & Lifecycle Verification
        run: python3 scripts/verify_cli_workflows.py

      - name: Run RFC 6265 Cookie Port Isolation Tests
        run: python3 scripts/test_cookie_port_scoping.py

      - name: Run 3D Network Orb Real Browser Verification
        run: python3 scripts/verify_orb_browser.py

      - name: Run Multi-Area Exploration Browser Verification
        run: python3 scripts/verify_area_exploration_browser.py

      - name: Run Performance Benchmarks
        run: ./scripts/benchmark.sh

