name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only workflow token: CI never needs to write to the repository.
permissions:
  contents: read

# Superseded pushes to the same ref should not keep burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Shell Script Syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Rust toolchain
        # Pinned in rust-toolchain.toml; keep this in sync so `cargo` and
        # `cargo clippy` resolve to exactly the same compiler locally and in CI.
        uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy

      - name: Record toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          cargo clippy --version
          git --version
          python3 --version

      - name: Install Frontend Dependencies & Run Frontend Tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Cache Cargo Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --locked --verbose

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Playwright
        run: |
          pip install -r requirements-test.txt
          playwright install --with-deps chromium

      - name: Build PreBase Binary
        run: cargo build --release --locked --bin prebase

      - name: Run Release Binary Smoke Verification
        run: python3 scripts/smoke_test_release_binary.py

      - name: Run CLI Workflow & Lifecycle Verification
        run: python3 scripts/verify_cli_workflows.py

      - name: Run CLI Installation & Symlink Verification
        run: python3 scripts/verify_installation_workflows.py

      - name: Run Real Product CLI & Graph Correctness Evaluation
        run: python3 scripts/real_product_cli_evaluation.py

      - name: Run RFC 6265 Cookie Port Isolation Tests
        run: python3 scripts/test_cookie_port_scoping.py

      - name: Run Benchmark Robustness & Security Checks
        run: python3 scripts/test_benchmark_robustness.py

      - name: Run Stage 2 2D Relationship Explorer E2E Verification
        run: python3 scripts/e2e_stage2_verification.py

      - name: Run Full E2E & Live Filesystem Synchronization Verification
        run: python3 scripts/e2e_full_verification.py

      - name: Run 3D Network Orb Real Browser Verification
        run: python3 scripts/verify_orb_browser.py

      - name: Run Multi-Area Exploration Browser Verification
        run: python3 scripts/verify_area_exploration_browser.py

      - name: Run Synchronized Area Labels & Motion Browser Verification
        run: python3 scripts/verify_area_labels_browser.py

      - name: Run Temporal DAG & Auth Lifecycle Real Browser Verification
        run: python3 scripts/verify_temporal_lifecycle_browser.py

      - name: Run Watcher Feedback Loop Verification
        run: python3 scripts/verify_watcher_feedback_loop.py

      - name: Run Behavioral Regression Real Browser Verification
        run: python3 scripts/verify_behavioral_regression_browser.py

      - name: Run Unrestricted 3D Rotation & Native Zoom Browser Verification
        run: python3 scripts/verify_unrestricted_rotation_and_zoom_browser.py

      - name: Run Installed Browser Session Reuse E2E Verification
        run: python3 scripts/verify_session_reuse_browser.py

      - name: Run Performance Benchmarks
        run: ./scripts/benchmark.sh

      # Upload browser failure artifacts (sanitized failure screenshots and diagnostics)
      - name: Upload browser failure artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-artifacts-${{ matrix.os }}
          path: test-results/failure-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      # Raw logs can contain bootstrap/session tokens, so they are deliberately
      # not uploaded. Use the failing step's GitHub log instead.
