name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only workflow token: CI never needs to write to the repository.
permissions:
  contents: read

# Superseded pushes to the same ref should not keep burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust toolchain
        # Pinned in rust-toolchain.toml; keep this in sync so `cargo` and
        # `cargo clippy` resolve to exactly the same compiler locally and in CI.
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Record toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          cargo clippy --version
          git --version
          python3 --version

      - name: Install Frontend Dependencies & Run Frontend Tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace --locked --verbose

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Playwright
        run: |
          pip install playwright==1.49.1
          playwright install --with-deps chromium

      - name: Build PreBase Binary
        run: cargo build --release --locked --bin prebase

      - name: Run CLI Workflow & Lifecycle Verification
        run: python3 scripts/verify_cli_workflows.py

      - name: Run RFC 6265 Cookie Port Isolation Tests
        run: python3 scripts/test_cookie_port_scoping.py

      - name: Run 3D Network Orb Real Browser Verification
        run: python3 scripts/verify_orb_browser.py

      - name: Run Multi-Area Exploration Browser Verification
        run: python3 scripts/verify_area_exploration_browser.py

      - name: Run Performance Benchmarks
        run: ./scripts/benchmark.sh

      # Screenshots are UI evidence only and never contain session tokens.
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots-${{ matrix.os }}
          path: docs/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # Raw logs can contain bootstrap/session tokens, so they are deliberately
      # not uploaded. Use the failing step's GitHub log instead.
